<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Buns Bakery</title>
    <style type="text/css" media="all">@import "css/menucss.css";</style>
</head>
<body>
<div id = "header">
    <img src = pictures/bbbakery_banner.png alt = "banner" width=" 100%" class = "center" />
</div>    

<div id = "navbar">
    <button class="button" onclick = "document.location = 'index.html' " >Home</button>

    <button class= "button" onclick = "document.location = 'menu.html' " >Menu </button>

    <button class = "button" onclick = "document.location = 'aboutUs.html' ">About Us</button>

    <div class = "icon-cart">
        <img src = "pictures/cart.png" alt = "cart" width = "25" />
        <span>0</span>
    </div>

</div>
<div class = "listProduct">

    <div class="item-row">

        <div class = "row-title">
            <p> Cookies </p>
        </div>
        <div class = "item-grid">
            <div class="item">
                <img src = "pictures/cookie.jpeg" alt = "Item 1" width="200">
                <p>Snickerdoodle Cookie</p>
                <div class = "cost" > $.99 </div>
                <button class = "add-to-cart">Add to Cart</button>
                
            </div>
            <div class = "item">
                <img src = "pictures/sugarcookie.jpeg" alt = "Item 2" width="200">
                <p>Sugar Cookie </p>
                <div class = "cost" > $.99 </div>
                <button class = "add-to-cart">Add to Cart</button>
            </div>
            <div class = "item">
                <img src = "pictures/darkchocolatecookie.jpeg" alt = "Item 3" width="200">
                <p>Dark chocolate Cookie</p>
                <div class = "cost" > $.99 </div>
                <button class = "add-to-cart">Add to Cart</button>
            </div>
        </div>
    </div>

    <div class = "item-row-2">

        <div class = "row-title">
            <p> Pastries  </p>
        </div>

        <div class = "item-grid">
            <div class = "item">
                <img src = "pictures/almondbread.jpeg" alt = "Item 4" width="200">
                <p>Almond Bread</p>
                <div class = "cost" > $1.99 </div>
                <button class = "add-to-cart">Add to Cart</button>
            </div>
            <div class = "item">
                <img src = "pictures/choccrossant.jpeg" alt = "Item 5" width="200">
                <p>Chocolate Croissant</p>
                <div class = "cost" > $1.99 </div>
                <button class = "add-to-cart">Add to Cart</button>
            </div>
            <div class = "item">
                <img src = "pictures/crosant.jpeg" alt = "Item 6" width="200">
                <p>Croissant</p>
                <div class = "cost" > $1.99 </div>
                <button class = "add-to-cart">Add to Cart</button>
            </div>
        </div>
    </div>



    <div class="item-row-3">

        <div class = "row-title">
            <p> Pies </p>
        </div>
        <div class = "item-grid">
            <div class="item">
                <img src = "pictures/pecanpie.jpeg" alt = "Item 7" width="200">
                <p>Pecan Pie</p>
                <div class = "cost" > $1.50 </div>
                <button class = "add-to-cart">Add to Cart</button>
            </div>
            <div class = "item">
                <img src = "pictures/whitepie.jpeg" alt = "Item 8" width="200">
                <p> Coconut Pie </p>
                <div class = "cost" > $1.50 </div>
                <button class = "add-to-cart">Add to Cart</button>
            </div>
            <div class = "item">
                <img src = "pictures/cookie.jpeg" alt = "Item 9" width="200">
                <p> New Pie</p>
                <div class = "cost" > $100,000 </div>
                <button class = "add-to-cart">Add to Cart</button>
            </div>
        </div>
    </div> 
</div>
<script src = "js/app.js"></script>
</body>
</html>
