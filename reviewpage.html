<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style type="text/css" media="all">@import "css/reviewpage.css";</style>
    <title>BigBunsBakery</title>
</head>

<body>

<div id = "header">
    <img src = pictures/bbbakery_banner.png alt = "banner" width=" 100%" class = "center" />
</div>    

<div id = "navbar">
    <button class="button" onclick = "document.location = 'index.html' " >Home</button>

    <button class= "button" onclick = "document.location = 'menu.html' " >Menu </button>

    <button class = "button" onclick = "document.location = 'aboutUs.html' ">About Us</button>

   <button class="button" onclick = "document.location = 'cart.html' "> 
        <img src = "pictures/cart.png" alt = "cart" width = "25" />
    </button>
</div>

<div id="container">
    <h1>User Reviews</h1>
        <div id="reviewcontainer">
            <div id="user-review-form">
                <h3>Leave a Review!</h3>

                <label>Name:</label> <br>
                <input type="text" id="name">

                <br><br>

                <label>Review:</label> <br>
                <textarea id="review-text"></textarea>
            </div>

            <div class="stars">
                <span class="fa fa-star star" data-value="1"></span>
                <span class="fa fa-star star" data-value="2"></span>
                <span class="fa fa-star star" data-value="3"></span>
                <span class="fa fa-star star" data-value="4"></span>
                <span class="fa fa-star star" data-value="5"></span>
            </div>

            <br><button onclick="addReview()">Submit Review</button>
        </div>

        <br><br>
        <h2>Reviews</h2>
        <div id="reviews"></div>

        <script src="js/reviews.js"></script>
</div>

</body>
</html>
