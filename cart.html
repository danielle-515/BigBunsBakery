<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Buns Bakery</title>
    <style type="text/css" media="all">@import "css/checkout.css";</style>
</head>
<body>
    <div id = "header">
    <img src = pictures/bbbakery_banner.png alt = "banner" width=" 100%" class = "center" />
    </div>      

    <div id = "navbar">
        <button class="button" onclick = "document.location = 'index.html' " >Home</button>

        <button class= "button" onclick = "document.location = 'menu.html' " >Menu </button>

        <button class = "button" onclick = "document.location = 'aboutUs.html' ">About Us</button>

        <button class="button" onclick = "document.location = 'cart.html' "> Checkout </button>

        <div class = "icon-cart">
        <img src = "pictures/cart.png" alt = "cart" width = "25" />
        <span>0</span>
        
    </div>
    </div>

    <div id= "container">
        <h1> Checkout Page </h1>
        <p> This is where the checkout process will take place. </p>

       

    </div>


    <div class = "cartTab">
        <h1> Your Cart </h1>
        <p> Items you have added to your cart will appear here. </p>
        <div class = "listCart">
            
            <div class = "item">
                <div class = "img">
                    <img src = "pictures/cookie.jpeg" alt = "Item 1" width="100"> 
                </div>
                <div class = "name"> NAME </div>
                <div class = "quantity">    
                    <span class = "add"> < </span>
                    <span>1</span>
                    <span class = "minus"> > </span>
                </div>
                <div class = "totalprice"> $0.00 </div>
            </div>
        </div>
    </div>


<script src = "js/app.js"></script>
</body>
</html>
